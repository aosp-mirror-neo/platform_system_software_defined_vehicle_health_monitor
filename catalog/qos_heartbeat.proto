syntax = "proto3";

import "google/protobuf/timestamp.proto";

import "sdv/vsidl/v1/annotations.proto";

package com.android.sdv.health;

// Topic describing health of a monitored SDV service bundle.
message QosHeartbeat {
  option (.sdv.vsidl.v1.publication) = {
    message_count: 2
    model: SINGLE_PUB
  };
  // Required.
  // The current timestamp (at heartbeat “send” time).
  .google.protobuf.Timestamp timestamp = 1;

  // Required.
  // The timestamp that corresponds to the underlying “data” creation time.
  .google.protobuf.Timestamp data_timestamp = 2;
}