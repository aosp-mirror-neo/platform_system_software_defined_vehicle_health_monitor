syntax = "proto3";

package com.sdv.google.health;

// Service bundle implicit health monitoring configuration.

// The SB instance must publish heartbeats as soon as it has reached STARTED orchestration state,
// with the initial delay configurabe via the `initial_delay_ms` field. Implicit monitoring does not
// require manual registration via RPC, from the service bundle instances.

// The alternative to implicit monitoring is explicit monitoring, which uses RPC to register to and
// deregister from Hearbeat monitoring. This allows to customise the monitoring period. See also:
// `${ANDROID_ROOT}/system/software_defined_vehicle/service_bundles_registry/proto/health_monitor_registration_service.proto`

// To use implicit heartbeat monitoring, the service bundle must link a .textproto file of type
// `ServiceBundleHealthConfiguration` as part of its ServiceBundleManifest. See also:
// `${ANDROID_ROOT}/system/software_defined_vehicle/service_bundles_registry/proto/sdv_service_bundle_manifest.proto`
message ServiceBundleHealthConfiguration {
  // Key should contain the instance name that the `HealthConfiguration` applies to.
  map<string, HealthConfiguration> instance_config = 1;
}

// Service bundle *instance* health monitoring configuration.
//
// This configures the VM Health Monitor to expect a certain heartbeat rythm from the SB instance.
//
// * If SB bundle opts for explicit heartbeat registration, `HealthConfiguration` should be
// registered with the VM Health Monitor through it's registration RPC channel.
// * If SB bundle opts for implicit heartbeat registration, `HealthConfiguration` is part of the
// `ServiceBundleHealthConfiguration` map.
//
// The service bundle is considered unhealthy if its service heartbeats are missing or delayed,
// Namely:
// 1. The time passed between registration t_{0} and reporting the first
// heartbeat t_{1} exceeds the initial delay t_{init}: t > t_{1} - t_{0},
// 2. The time duration between two consecutive heartbeats (t_{i}, t_{i-1}) exceeds the sum of
// reporting periods p multiplied by the number of periods N and task duration t_{exec}: t_{i} -
// t_{i-1} > p*N + t_{exec}, or
// 3. The time duration between the observation and the last reported heartbeat (t_{o}, t_{last})
// exceeds the sum of reporting periods p multiplied by the number of periods N and task duration
// t_{exec}: t_{o} - t_{last} > p*N + t_{exec}.
message HealthConfiguration {
  // Required.
  // Whether the service should report a heartbeat to the VM Health Monitor.
  bool is_heartbeat_monitored = 1;

  // Optional.
  // Initial delay in milliseconds is the time between the service starts and its first heartbeat.
  // Ignored if is_heartbeat_monitored is set to false.
  optional uint64 initial_delay_ms = 2;

  // Optional.
  // Period of reporting a heartbeat in milliseconds which corresponds to the periodicity of
  // executing a business logic by the SDV service. This value should be larger than 0.
  // Ignored if is_heartbeat_monitored is set to false.
  optional uint64 period_ms = 3;

  // Optional.
  // The number of periods missing a heartbeat before the Health Monitor should consider the
  // service as unhealthy. This value should be larger than 0.
  // Ignored if is_heartbeat_monitored is set to false.
  optional uint64 num_periods = 4;

  // Optional.
  // Duration of the business logic the SDV service bundle executes in milliseconds.
  // Ignored if is_heartbeat_monitored is set to false.
  optional uint64 task_duration_ms = 5;
}

