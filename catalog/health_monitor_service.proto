syntax = "proto3";

package com.android.sdv.health;

import "health_config.proto";

// RPC Interface of the VM Health Monitor Agent for querying details about the current VM
// health.
//
// Typically, an OEM bundle monitors the overall health of the SDV instance by listening to
// high-frequency `VMHealth` publication. If violations are detected, this RPC interface can
// be used to retrieve detailed information about the malfunctioning component.
service HealthMonitorService {
  // Returns the list of currently running SDV service bundles that were created or started
  // by the orchestrator on this VM.
  rpc ListAllServiceBundles(ListAllServiceBundlesRequest) returns (ListAllServiceBundlesResponse) {}

  // Returns the list of crashed SDV service bundles.
  rpc ListCrashingServiceBundles(ListCrashingServiceBundlesRequest)
      returns (ListCrashingServiceBundlesResponse) {}

  // Returns the list of recovering SDV service bundles.
  rpc ListRecoveringServiceBundles(ListRecoveringServiceBundlesRequest)
      returns (ListRecoveringServiceBundlesResponse) {}

  // Returns the list of unhealthy monitored SDV service bundles, which registered for reporting
  // heartbeats but failed to report heartbeats on time.
  rpc ListUnhealthyMonitoredServiceBundles(ListUnhealthyMonitoredServiceBundlesRequest)
      returns (ListUnhealthyMonitoredServiceBundlesResponse) {}

  // Returns a list of QoS monitoring violations currently detected.
  // Provides a snapshot of the current system state.
  rpc ListQosViolations(ListQosViolationsRequest)
      returns (ListQosViolationsResponse) {}
}

message ViolationId {
  // Identifier of the listener in the QoS-monitored communication. This listener is
  // responsible for publishing QoS heartbeats upon receiving QoS-relevant messages.
  // See also qos_heartbeat.proto.
  string subscriber_fqin = 1;

  // The topic where the listener publishes QoS heartbeats that led to the violation.
  // This matches the topic configured in the listener's health configuration.
  // See also `InstanceConfiguration` message, `qos_config` field, in
  // `health_config.proto`.
  string qos_hb_topic = 2;
}

message QosViolation {
  // Identifier of the violation source.
  ViolationId id = 1;

  // Latency violation detected. Monitored messages spending too much time in transit.
  bool latency_violation_detected = 2;

  // Frequency violation detected. Monitored messages do not reach the listener reporting
  // QoS heartbeats within the configured maximum allowed interval.
  bool frequency_violation_detected = 3;

  // SDV internal error detected for this identifier.
  bool sdv_internal_error = 4;
}

message ListQosViolationsRequest {}

message ListQosViolationsResponse {
  // List of QoS violations. At most one entry per QoS monitor.
  repeated QosViolation violations = 1;
}

message ListAllServiceBundlesRequest {}

message ListAllServiceBundlesResponse {
  // List of FQINs of the service bundles that are created or started on this VM.
  // It is empty if no service bundles are created or started on this VM.
  repeated string fqin = 1;
}

message ListCrashingServiceBundlesRequest {}

message ListCrashingServiceBundlesResponse {
  // List of FQINs of the crashed SDV service bundles on this VM.
  // It is empty if no service bundles are in the crashed state on this VM.
  repeated string fqin = 1;
}

message ListRecoveringServiceBundlesRequest {}

message ListRecoveringServiceBundlesResponse {
  // List of FQINs of the bundles that are currently recovering on this VM.
  // A bundle is recovering if it has crashed or a transition to a new state
  // has failed, and it's configured to be restartable. In this case, the
  // orchestrator informs the HM that it's trying to recover the bundle.
  // Eventually, this bundle should be in the ListAllServiceBundles or
  // ListCrashingServiceBundles responses, unless it was destroyed (in which
  // case it won't be returned by any of these API calls).
  // It is empty if no service bundles are in the recovering state on this VM.
  repeated string fqin = 1;
}

message ListUnhealthyMonitoredServiceBundlesRequest {}

message ListUnhealthyMonitoredServiceBundlesResponse {
  // List of FQINs of the unhealthy SDV service bundles on this VM which did not report their
  // heartbeats on time according to their registered health configuration.
  // It is empty if all monitored service bundles on the VM report their heartbeats on time.
  repeated string fqin = 1;
}
